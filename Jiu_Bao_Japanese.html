function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

      rec.onend=function(){if(!got&&!stopped){got=true;window.onHeardErr('沒有聽到,請再說一次');}};
      try{rec.start();}catch(e){window.onHeardErr('無法開始聆聽');}
    },
    stopAll:function(){stopped=true;try{speechSynthesis.cancel();}catch(e){}try{if(rec)rec.abort();}catch(e){}},
    ask:function(id,system,msgs){this.ask2(id,system,msgs,ST.gkey||'',ST.gmodel||'');},

var HR={'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'o','ん':'n','が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','ゔ':'vu'};

function kata2hira(s){return String(s).replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60);});}
function toRomaji(s){
  s=kata2hira(s);var out='',i=0,dbl=false;
  while(i<s.length){
    var c=s.charAt(i),n=s.charAt(i+1);
    if(c==='っ'){dbl=true;i++;continue;}
    var r;
    if(HR2[c+n]){r=HR2[c+n];i+=2;}
    else if(YO[n]&&HR[c]&&/[いき]|[ぎしじちぢにひびぴみり]/.test(c)){
      var b=HR[c];var y=YO[n];
      if(c==='し')r='sh'+y;else if(c==='じ')r='j'+y;else if(c==='ち')r='ch'+y;else if(c==='ぢ')r='j'+y;else r=b.charAt(0)+(b.length>2?b.charAt(1):'')+'y'+y;

function lcsMask(target,heard){
  var A=target,B=heard,m=A.length,n=B.length,d=[],i,j;
  for(i=0;i<=m;i++){d[i]=[];for(j=0;j<=n;j++)d[i][j]=0;}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=(A[i-1]===B[j-1])?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);
  var mask=[];for(i=0;i<m;i++)mask.push(false);
  i=m;j=n;while(i>0&&j>0){if(A[i-1]===B[j-1]){mask[i-1]=true;i--;j--;}else if(d[i-1][j]>=d[i][j-1])i--;else j--;}

function sendToAI(t,call,hidden){

function callListen(){
  var s=ai.sess;callStatus(ai.lang===JA?'🎤 換你說(日語)…':'🎤 換你說(中文)…','listen');var cp=$('callpart');if(cp)cp.textContent='';
  listen(function(t,err){
    if(!ai.call||ai.sess!==s)return;
    if(!t){
      if(/權限|沒有語音辨識|無法/.test(err||'')){callStatus(err,'idle');endCall();return;}
      ai.silent++;
      if(ai.silent>=3){callStatus('好像沒有人在,通話結束了','idle');say('我會在這裡等你,準備好再按通話。',null,{lang:'zh-TW'});endCall();return;}
      callStatus('我沒聽到,再說一次吧','listen');setTimeout(function(){if(ai.call&&ai.sess===s)callListen();},500);return;
    }
    ai.silent=0;sendToAI(t,true);
  },function(p){var e=$('callpart');if(e)e.textContent='「'+p+'」';},ai.lang);
}

var kq={};
R.kanaq=function(){
  setTitle('假名小測驗');$('back').style.display='';
  var all=[];KANA[0][1].concat(KANA[1][1]).forEach(function(x){all.push(x);});
  kq={qs:shuffle(all).slice(0,10),i:0,ok:0,all:all};drawKq();
};
function drawKq(){
  if(kq.i>=kq.qs.length){addStar(kq.ok);$('main').innerHTML='<div class="card"><div class="score">'+kq.ok+' / '+kq.qs.length+'</div><div class="zh">'+(kq.ok>=9?'太厲害了!':'再練習就會更熟')+'</div></div><div class="row"><button class="btn g" onclick="go(\'kanaq\')">再玩一次</button><button class="btn gray" onclick="go(\'kana\')">回五十音</button></div>';return;}
  var q=kq.qs[kq.i],kata=Math.random()<0.5,ch=kata?q[1]:q[0];
  var opts=[q[2]],seen={};seen[q[2]]=1;
  shuffle(kq.all).forEach(function(x){if(opts.length<4&&!seen[x[2]]){seen[x[2]]=1;opts.push(x[2]);}});
  opts=shuffle(opts);kq.cur={ans:q[2],opts:opts,ch:ch};
  var h='<div class="prog"><i style="width:'+(kq.i/kq.qs.length*100)+'%"></i></div><div class="card"><div class="ipabig">'+esc(ch)+'</div><div class="msg">這個假名怎麼唸?</div></div><div class="opts2">';
  opts.forEach(function(o,k){h+='<button class="opt" onclick="kqPick('+k+')">'+esc(o)+'</button>';});
  $('main').innerHTML=h+'</div>';say(ch);
}
window.kqPick=function(k){
  var btns=document.querySelectorAll('.opt');if(btns[0].disabled)return;btns.forEach(function(b){b.disabled=true;});
  var good=kq.cur.opts[k]===kq.cur.ans;btns[k].className='opt '+(good?'ok':'bad');
  if(!good)kq.cur.opts.forEach(function(o,j){if(o===kq.cur.ans)btns[j].className='opt ok';});
  if(good)kq.ok++;
  setTimeout(function(){kq.i++;drawKq();},700);
};
