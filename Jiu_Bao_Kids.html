<script>// ===== 瀏覽器模式(手機網頁版):用瀏覽器內建的語音;AI 直接呼叫 Gemini =====
var GEM_MODELS=['gemini-3.5-flash-lite','gemini-3.1-flash-lite','gemini-3.6-flash','gemini-2.5-flash'];
function geminiAsk(system,msgsJson,key,model,cb){
  var msgs=JSON.parse(msgsJson),contents=[];
  msgs.forEach(function(m){contents.push({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]});});
  var list=model?[model]:GEM_MODELS.slice(),idx=0,lastErr='';
  (function next(){
    if(idx>=list.length){cb(null,'AI 老師暫時連不上:'+lastErr);return;}
    var m=list[idx++];
    var body=JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:contents,generationConfig:{maxOutputTokens:800,temperature:0.7}});
    fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:body})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
    .then(function(x){
      if(x.s>=200&&x.s<300){
        var t='';try{x.j.candidates[0].content.parts.forEach(function(p){if(p.text)t+=p.text;});}catch(e){}
        t=t.trim();if(t)cb(t,null);else{lastErr='沒有回應內容';next();}
      }else{
        lastErr=(x.j&&x.j.error&&x.j.error.message)?x.j.error.message:('代碼 '+x.s);
        if(x.s===400&&/API key/i.test(lastErr)){cb(null,'Gemini 金鑰不正確,請到「🔑 AI 設定」重新貼上');return;}
        if(x.s===403){cb(null,'Gemini 金鑰沒有權限,請確認金鑰是否正確');return;}
        next();
      }
    }).catch(function(e){lastErr=String(e);next();});
  })();
}
function makeBrowserBridge(){
  var rec=null,stopped=false;
  return {
    speak:function(t,r,id){this.speakL(t,r,id,'en-US');},
    speakL:function(text,rate,id,lang){
      if(!window.speechSynthesis){setTimeout(function(){window.onSpoken(id);},50);return;}
      try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;u.pitch=window.__PITCH||1;var d=false;var fin=function(){if(!d){d=true;window.onSpoken(id);}};u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
        setTimeout(fin,Math.max(4000,text.length*400));}catch(e){window.onSpoken(id);}
    },
    listen:function(){this.listenL('en-US');},
    listenL:function(lang){
      var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){window.onHeardErr('這個瀏覽器不支援語音辨識,請用 Chrome');return;}
      try{stopped=true;if(rec)rec.abort();}catch(e){}
      stopped=false;var got=false;rec=new SR();rec.lang=lang;rec.interimResults=true;rec.maxAlternatives=1;
      rec.onresult=function(e){var t='',fin=false;for(var i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true;}
        if(fin){got=true;window.onHeard(t);}else window.onPartial(t);};
      rec.onerror=function(e){if(got||stopped)return;got=true;window.onHeardErr(e.error==='not-allowed'?'沒有麥克風權限,無法練習口說':'沒有聽到,請再說一次');};
      rec.onend=function(){if(!got&&!stopped){got=true;window.onHeardErr('沒有聽到,請再說一次');}};
      try{rec.start();}catch(e){window.onHeardErr('無法開始聆聽');}
    },
    stopAll:function(){stopped=true;try{speechSynthesis.cancel();}catch(e){}try{if(rec)rec.abort();}catch(e){}},
    snap:function(id){
      var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');inp.style.display='none';document.body.appendChild(inp);
      inp.onchange=function(){var f=inp.files&&inp.files[0];try{document.body.removeChild(inp);}catch(e){}if(!f){window.onSnap(id,null,'沒有選到照片');return;}
        var rd=new FileReader();rd.onload=function(){var im=new Image();
          im.onload=function(){function sc(mx,q){var k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);}
            window.__IMG=sc(1280,.8).split(',')[1];window.onSnap(id,sc(480,.6),null);};
          im.onerror=function(){window.onSnap(id,null,'照片讀不出來');};im.src=rd.result;};
        rd.onerror=function(){window.onSnap(id,null,'照片讀不出來');};rd.readAsDataURL(f);};
      inp.click();
    },
    askJ:function(id,system,prompt,key,model,maxTok,useImg){
      if(!key){window.onAI(id,'請先到家長區的「🔑 AI 設定」貼上 Gemini 金鑰(免費)',false);return;}
      var parts=[];if(useImg){if(!window.__IMG){window.onAI(id,'還沒有拍照',false);return;}parts.push({inline_data:{mime_type:'image/jpeg',data:window.__IMG}});}
      parts.push({text:prompt});
      var list=model?[model]:GEM_MODELS.slice(),idx=0,lastErr='';
      (function next(){
        if(idx>=list.length){window.onAI(id,'AI 暫時連不上:'+lastErr,false);return;}
        var m=list[idx++];
        fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},
          body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:parts}],generationConfig:{maxOutputTokens:maxTok||4096,temperature:0.6,responseMimeType:'application/json'}})})
        .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
        .then(function(x){
          if(x.s>=200&&x.s<300){var t='';try{x.j.candidates[0].content.parts.forEach(function(p){if(p.text)t+=p.text;});}catch(e){}
            t=t.trim();if(t)window.onAI(id,t,true);else{lastErr='沒有回應內容';next();}}
          else{lastErr=(x.j&&x.j.error&&x.j.error.message)?x.j.error.message:('代碼 '+x.s);

GAMES.digit=function(L,fin){
  var lens=[3,4,5],ri=0,wrong=0;$('bub').textContent='記住數字的順序!';
  function round(){
    if(ri>=lens.length){say('你的記憶力好強!',function(){fin(wrong);});return;}
    var n=lens[ri],seq=[];for(var i=0;i<n;i++)seq.push(rand(0,9));
    $('gm').innerHTML='<div class="prop" style="min-height:130px"><div class="bigch" id="dg" style="font-size:100px">👀</div></div><div id="inp" class="msg" style="text-align:center;font-size:36px;min-height:50px"></div><div class="og" id="kp" style="grid-template-columns:repeat(5,1fr);opacity:.3"></div>';
    var k='';for(var d=0;d<10;d++)k+='<button data-d="'+d+'" style="font-size:32px;font-weight:bold;height:66px">'+d+'</button>';$('kp').innerHTML=k;
    for(var j=0;j<n;j++)(function(j){later(function(){$('dg').textContent=seq[j];beep([[500+seq[j]*60,.15]]);later(function(){if($('dg'))$('dg').textContent='';},650);},1200+j*1000);})(j);
    later(function(){$('dg').textContent='❓';$('kp').style.opacity=1;say('換你囉!');entry(seq);},1200+n*1000+300);
  }
  function entry(seq){var got=[];var bs=$('kp').querySelectorAll('button');
    for(var k=0;k<bs.length;k++)(function(b){b.onclick=function(){var d=+b.getAttribute('data-d');got.push(d);$('inp').textContent=got.join(' ');sfxTick();
      if(got.length===seq.length){var ok=got.join()===seq.join();if(ok){sfxOk();mood('cheer');ri++;hush();say('答對了!',function(){later(round,200);});}else{wrong++;sfxNo();mood('oops');ri++;hush();say('差一點點!答案是,'+seq.join('、')+'。',function(){later(round,200);});}}};})(bs[k]);}
  say('我會秀出數字,請你記住順序!');later(round,2800);
};
GAMES.simon=function(L,fin){
  var C=[['#ef476f',392],['#06a77d',440],['#118ab2',523],['#f2c200',587]],ri=0,wrong=0,lens=[2,3,4,5];$('bub').textContent='看顏色,記順序!';
  $('gm').innerHTML='<div class="og" style="grid-template-columns:repeat(2,1fr);max-width:300px">'+C.map(function(c,i){return '<button data-i="'+i+'" style="height:110px;background:'+c[0]+';opacity:.5"></button>';}).join('')+'</div><div class="msg" id="sm" style="text-align:center"></div>';
  var bs=$('gm').querySelectorAll('button');
  function flash(i){bs[i].style.opacity=1;bs[i].style.transform='scale(1.08)';beep([[C[i][1],.3]]);later(function(){bs[i].style.opacity=.5;bs[i].style.transform='';},350);}
  function round(){if(ri>=lens.length){say('顏色記憶,你全部通過!',function(){fin(wrong);});return;}var seq=[];for(var i=0;i<lens[ri];i++)seq.push(rand(0,3));play(seq,0);}
  function play(seq,tries){var got=0,live=false;$('sm').textContent='看好喔…';seq.forEach(function(c,j){later(function(){flash(c);},900+j*750);});
    later(function(){live=true;$('sm').textContent='換你囉!';},900+seq.length*750+200);
    for(var k=0;k<bs.length;k++)(function(b,i){b.onclick=function(){if(!live)return;flash(i);if(i===seq[got]){got++;if(got===seq.length){live=false;ri++;sfxOk();mood('cheer');later(function(){say('答對了!',function(){later(round,200);});},500);}}else{live=false;wrong++;sfxNo();mood('oops');if(tries>=1){ri++;later(function(){say('沒關係,我們下一關!',function(){later(round,200);});},400);}else later(function(){say('再看一次喔!',function(){later(function(){play(seq,tries+1);},300);});},400);}};})(bs[k],k);}
  say('四個顏色會亮起來,請你記住順序!');later(round,3200);
};
GAMES.stroop=function(L,fin){
  var CL=[['紅','#ef476f'],['綠','#06a77d'],['藍','#118ab2'],['黃','#f2c200']],t=0,wrong=0;$('bub').textContent='這個字是什麼「顏色」?';
  function nextT(){
    if(t>=8){say('你的眼睛和大腦都好厲害!',function(){fin(Math.floor(wrong/2));});return;}
    var w=pick(CL),c=pick(CL.filter(function(x){return x!==w;}));
    $('gm').innerHTML='<div class="prop"><div style="font-size:110px;font-weight:bold;color:'+c[1]+'">'+w[0]+'</div></div><div class="og" style="grid-template-columns:repeat(2,1fr);max-width:300px">'+CL.map(function(x){return '<button data-c="'+x[0]+'" style="height:84px;background:'+x[1]+'"></button>';}).join('')+'</div>';
    var bs=$('gm').querySelectorAll('button');for(var k=0;k<bs.length;k++)(function(b){b.onclick=function(){if(b.getAttribute('data-c')===c[0]){sfxOk();t++;nextT();}else{wrong++;sfxNo();mood('oops');toast('看顏色,不是看字喔');}};})(bs[k]);
  }
  say('字會騙人!請你按,字的顏色,不要管字寫什麼。');later(nextT,3200);
};
GAMES.gonogo=function(L,fin){
  var n=0,miss=0,bad=0,total=16,cat=false,tapped=false;$('bub').textContent='看到 🐱 點一下,看到 🐶 不要點!';
  $('gm').innerHTML='<div class="prop" style="min-height:200px"><button id="gb" style="font-size:110px;border:0;background:none;font-family:inherit">⏳</button></div><div class="msg" id="gs2" style="text-align:center"></div>';
  $('gb').onclick=function(){if(tapped||!$('gb').getAttribute('data-on'))return;tapped=true;if(cat){sfxOk();$('gs2').textContent='好棒!';}else{bad++;sfxNo();mood('oops');$('gs2').textContent='那是小狗,要忍住喔';}};
  function step(){
    if(n>=total){$('gb').textContent='🎉';$('gb').removeAttribute('data-on');say('完成!你很會控制自己!',function(){fin(Math.floor((bad+miss)/2));});return;}
    if(n>0&&cat&&!tapped)miss++;
    cat=Math.random()<.6;tapped=false;n++;$('gs2').textContent='';$('gb').textContent=cat?'🐱':'🐶';$('gb').setAttribute('data-on','1');
    later(function(){$('gb').textContent='·';$('gb').removeAttribute('data-on');later(step,350);},1000);
    if(n===total)later(function(){},0);
  }
  say('看到小貓,點一下。看到小狗,要忍住不能點喔!');later(step,3600);
};
