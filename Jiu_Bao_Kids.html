<script>// ===== 瀏覽器模式(手機網頁版):用瀏覽器內建的語音;AI 直接呼叫 Gemini =====
var GEM_MODELS=['gemini-3.5-flash-lite','gemini-3.1-flash-lite','gemini-3.6-flash','gemini-2.5-flash'];
function geminiAsk(system,msgsJson,key,model,cb){
  var msgs=JSON.parse(msgsJson),contents=[];
  msgs.forEach(function(m){contents.push({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]});});
  var list=model?[model]:GEM_MODELS.slice(),idx=0,lastErr='';
  (function next(){
    if(idx>=list.length){cb(null,'AI 老師暫時連不上:'+lastErr);return;}
    var m=list[idx++];
    var body=JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:contents,generationConfig:{maxOutputTokens:800,temperature:0.7}});
    fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:body})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
    .then(function(x){
      if(x.s>=200&&x.s<300){
        var t='';try{x.j.candidates[0].content.parts.forEach(function(p){if(p.text)t+=p.text;});}catch(e){}
        t=t.trim();if(t)cb(t,null);else{lastErr='沒有回應內容';next();}
      }else{
        lastErr=(x.j&&x.j.error&&x.j.error.message)?x.j.error.message:('代碼 '+x.s);
        if(x.s===400&&/API key/i.test(lastErr)){cb(null,'Gemini 金鑰不正確,請到「🔑 AI 設定」重新貼上');return;}
        if(x.s===403){cb(null,'Gemini 金鑰沒有權限,請確認金鑰是否正確');return;}
        next();
      }
    }).catch(function(e){lastErr=String(e);next();});
  })();
}
function makeBrowserBridge(){
  var rec=null,stopped=false;
  return {
    speak:function(t,r,id){this.speakL(t,r,id,'en-US');},
    speakL:function(text,rate,id,lang){
      if(!window.speechSynthesis){setTimeout(function(){window.onSpoken(id);},50);return;}
      try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;var d=false;var fin=function(){if(!d){d=true;window.onSpoken(id);}};u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
        setTimeout(fin,Math.max(4000,text.length*400));}catch(e){window.onSpoken(id);}
    },
    listen:function(){this.listenL('en-US');},
    listenL:function(lang){
      var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){window.onHeardErr('這個瀏覽器不支援語音辨識,請用 Chrome');return;}
      try{stopped=true;if(rec)rec.abort();}catch(e){}
      stopped=false;var got=false;rec=new SR();rec.lang=lang;rec.interimResults=true;rec.maxAlternatives=1;
      rec.onresult=function(e){var t='',fin=false;for(var i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true;}
        if(fin){got=true;window.onHeard(t);}else window.onPartial(t);};
      rec.onerror=function(e){if(got||stopped)return;got=true;window.onHeardErr(e.error==='not-allowed'?'沒有麥克風權限,無法練習口說':'沒有聽到,請再說一次');};
      rec.onend=function(){if(!got&&!stopped){got=true;window.onHeardErr('沒有聽到,請再說一次');}};
      try{rec.start();}catch(e){window.onHeardErr('無法開始聆聽');}
    },
    stopAll:function(){stopped=true;try{speechSynthesis.cancel();}catch(e){}try{if(rec)rec.abort();}catch(e){}},
    ask:function(id,system,msgs){this.ask2(id,system,msgs,ST.gkey||'',ST.gmodel||'');},
    ask2:function(id,system,msgs,key,model){
      if(!key){window.onAI(id,'請先到首頁的「🔑 AI 設定」貼上 Gemini 金鑰(免費)',false);return;}
      geminiAsk(system,msgs,key,model,function(t,err){if(err)window.onAI(id,err,false);else window.onAI(id,t,true);});
    }
  };
}

function setTitle(t){$('title').textContent=t;}
function bk(){$('back').style.display=stack.length?'':'none';}
function go(name,arg){hush();if(cur)stack.push(cur);cur=[name,arg];bk();window.scrollTo(0,0);R[name](arg);}
function repl(name,arg){hush();cur=[name,arg];bk();window.scrollTo(0,0);R[name](arg);}
function goBack(){hush();if(!stack.length)return;cur=stack.pop();bk();window.scrollTo(0,0);R[cur[0]](cur[1]);}

  setTitle('Jiu Bao 成長樂園');updStars();
  var h=mascot('')+'<div class="bubble" id="bub">'+HI[0]+'</div><div class="msg" style="text-align:center">(點一點九寶,聽他說話)</div>';
  STAGES.forEach(function(s){
    if(s.open){var tot=allLessons().length,dn=allLessons().filter(function(l){return ST.prog[l];}).length;
      h+='<button class="lesson" onclick="go(\'stage\',1)"><span class="ic">'+s.e+'</span><span>第 '+s.id+' 關:'+s.n+'<small>'+s.age+'・已完成 '+dn+' / '+tot+' 課</small></span><span class="st">▶</span></button>';}
    else h+='<button class="lesson lock" onclick="soon()"><span class="ic">'+s.e+'</span><span>第 '+s.id+' 關:'+s.n+'<small>'+s.age+'・準備中</small></span><span class="st">🔒</span></button>';
  });
  h+='<div class="row"><button class="btn o" onclick="go(\'stickers\')">🏅 我的貼紙</button><button class="btn b" id="spd" onclick="cycSpd()">'+speedLbl()+'</button><button class="btn gray" onclick="go(\'parent\')">👨‍👩‍👧 家長區</button></div>';
  $('main').innerHTML=h;
  var m=function(){var t=pick(HI);$('bub').textContent=t;mood('cheer');say(t);};
  $('mas').onclick=m;$('bub').onclick=m;
};
window.soon=function(){var t='這一關還在準備中,先把第一關玩完吧!';toast(t);say(t);};
window.cycSpd=function(){ST.speed=(ST.speed+1)%3;save();$('spd').textContent=speedLbl();toast('說話速度:'+speedLbl());say('這是我的說話速度。');};
R.stage=function(sid){
  setTitle('第 1 關:大班 ~ 小一');var h='<div class="grid">';
  TOPICS.forEach(function(t){h+='<button class="big '+t.c+'" onclick="go(\'topic\',\''+t.id+'\')"><span class="ic">'+t.e+'</span>'+t.n+'<small>'+t.d+'</small><small>'+doneCount(t.id)+' / '+ORDER[t.id].length+' 課</small></button>';});
  $('main').innerHTML=h+'</div>';
};
R.topic=function(tid){
  var T=TOPICS.filter(function(x){return x.id===tid;})[0];setTitle(T.e+' '+T.n);var h='<div class="msg">一課一課玩,星星越多越棒!</div>';
  ORDER[tid].forEach(function(l,i){var L=LES[l],ok=unlocked(tid,i);
    h+='<button class="lesson'+(ok?'':' lock')+'" onclick="'+(ok?'go(\'teach\',\''+l+'\')':'lockMsg()')+'"><span class="ic">'+L.e+'</span><span>'+(i+1)+'. '+L.t+'<small>'+L.sub+'</small></span><span class="st">'+(ok?starStr(ST.prog[l]||0):'🔒')+'</span></button>';});
  $('main').innerHTML=h;
};
window.lockMsg=function(){toast('先完成上一課,就能解鎖喔!');};
// ---- 教學動畫 ----
function items(a){return a.map(function(e,i){return '<span class="it pop" style="animation-delay:'+(i*.12)+'s">'+e+'</span>';}).join('');}
function renderProp(s){
  var h='';
  if(s.l)h+='<div style="display:flex;align-items:center;justify-content:center;width:100%"><div class="grp" style="max-width:140px">'+items(s.l)+'</div><span class="vs">'+(s.op||'VS')+'</span><div class="grp" style="max-width:140px">'+items(s.r)+'</div></div>';
  if(s.items){h+='<div class="grp" style="max-width:'+(s.per?s.per*60:340)+'px">'+s.items.map(function(e,i){return '<span class="it'+(s.count?' hide':' pop')+'" style="animation-delay:'+(i*.15)+'s">'+e+(s.count?'<span class="n">'+(i+1)+'</span>':'')+'</span>';}).join('')+'</div>';}
  if(s.big)h+='<div style="text-align:center;width:100%;font-size:'+(/^[^<]{1,6}$/.test(s.big)?'90px':'20px')+'" class="pop">'+s.big+'</div>';
  if(s.html)h+=s.html;
  if(s.eq)h+='<div class="eq hide" id="eq">'+s.eq+'</div>';
  $('prop').innerHTML=h;$('prop').style.display=h?'flex':'none';
}
R.teach=function(lid){
  var L=LES[lid],sc=L.teach,idx=0,auto=true;setTitle(L.e+' '+L.t);
  $('main').innerHTML=mascot('sm')+'<div class="bubble" id="bub"></div><div class="prop" id="prop"></div><div class="prog"><i id="pg" style="width:0"></i></div>'+
   '<div class="ctl"><button id="pv">⏮</button><button id="pp">⏸</button><button id="nx">⏭</button><button id="rp">🔁</button></div><div class="row"><button class="btn g" id="gs">🎮 開始闖關</button></div>';
  function show(i){
    if(i>=sc.length){hush();mood('cheer');$('bub').textContent='學完囉!我們去闖關吧!';say('學完囉!我們去闖關吧!',function(){});$('pg').style.width='100%';return;}
    idx=i;hush();var s=sc[i];$('bub').textContent=s.s;renderProp(s);$('pg').style.width=Math.round(i/sc.length*100)+'%';
    if(s.count){var its=document.querySelectorAll('#prop .it'),gap=s.fast?380:640;for(var k=0;k<its.length;k++)(function(el,k){later(function(){el.className='it pop';el.style.animationDelay='0s';sfxTick();},400+k*gap);})(its[k],k);}
    var t=tok;
    say(s.s,function(){var e=$('eq');if(e)e.className='eq pop';if(auto)later(function(){if(tok===t)show(idx+1);},700);});
  }
  $('pv').onclick=function(){show(Math.max(0,idx-1));};
  $('nx').onclick=function(){show(idx+1);};
  $('rp').onclick=function(){show(idx);};
  $('pp').onclick=function(){auto=!auto;$('pp').textContent=auto?'⏸':'▶️';if(auto)show(idx);else toast('已暫停');};
  $('gs').onclick=function(){repl('play',lid);};
  show(0);
};
function sfxTick(){beep([[700,.08]]);}
// ---- 闖關 ----
var PRAISE=['答對了!你好棒!','太厲害了!','沒錯!就是這個!','耶!你真聰明!','好棒好棒!'];
R.play=function(lid){
  var L=LES[lid];setTitle(L.e+' '+L.t+' 闖關');
  if(L.game){$('main').innerHTML=mascot('sm')+'<div class="bubble" id="bub"></div><div id="gm"></div>';GAMES[L.game](L,function(w){finish(lid,w);});return;}
  var qs=L.qs(),i=0,wrong=0,tries=0,locked=false;
  $('main').innerHTML=mascot('sm')+'<div class="prog"><i id="pg" style="width:0"></i></div><div class="bubble" id="bub"></div><div class="prop" id="prop"></div><div class="opts" id="opts"></div>';
  function show(){
    if(i>=qs.length){finish(lid,wrong);return;}
    var q=qs[i];tries=0;locked=false;$('bub').textContent=q.q;$('pg').style.width=Math.round(i/qs.length*100)+'%';
    $('prop').innerHTML=q.v;$('prop').style.display=q.v?'flex':'none';
    var short=q.o.every(function(o){return o.indexOf('<svg')===0||o.replace(/<[^>]*>/g,'').length<=4;});
    var oh='';q.o.forEach(function(o,j){var plain=o.replace(/<[^>]*>/g,'');oh+='<button class="opt" data-j="'+j+'" style="'+(plain.length>8?'font-size:26px':'')+'">'+o+'</button>';});
    var op=$('opts');op.className='opts'+(short&&q.o.length===3?' three':'');op.innerHTML=oh;
    var bs=op.querySelectorAll('.opt');for(var k=0;k<bs.length;k++)(function(b){b.onclick=function(){pickA(b,parseInt(b.getAttribute('data-j'),10));};})(bs[k]);
    say(q.q);
  }
  function nextQ(){i++;show();}
  function pickA(b,j){
    if(locked)return;var q=qs[i],bs=$('opts').querySelectorAll('.opt');
    if(j===q.a){locked=true;b.className='opt ok';sfxOk();mood('cheer');hush();say(pick(PRAISE)+q.e,function(){later(nextQ,300);});}
    else{wrong++;tries++;b.className='opt no';b.disabled=true;sfxNo();mood('oops');hush();
      if(tries>=2){locked=true;bs[q.a].className='opt ok';say('沒關係!答案是,'+q.sp+'。'+q.e,function(){later(nextQ,300);});}
      else say('再想一想喔,你可以的!');}
  }
  show();
};
function finish(lid,wrong){
  var st=wrong<=1?3:wrong<=3?2:1,prev=ST.prog[lid]||0,isNew=prev===0;
  if(st>prev){ST.stars+=st-prev;ST.prog[lid]=st;}
  ST.wrong[lid]=(ST.wrong[lid]||0)+wrong;var d=today();ST.days[d]=(ST.days[d]||0)+1;save();
  repl('done',{lid:lid,st:st,isNew:isNew});
}
R.done=function(a){
  var L=LES[a.lid];setTitle('完成!');updStars();var ord=ORDER[L.topic],pos=ord.indexOf(a.lid),nx=ord[pos+1];
  $('main').innerHTML=mascot('')+'<div class="bubble">'+L.t+' 完成!</div><div class="card"><div style="font-size:60px">'+starStr(a.st)+'</div>'+(a.isNew?'<div style="font-size:26px;font-weight:bold;margin-top:8px">🏅 得到新貼紙:<span style="font-size:50px">'+L.e+'</span></div>':'<div class="msg">再玩一次,星星會更多喔!</div>')+'</div>'+
   '<div class="row">'+(nx?'<button class="btn g" onclick="repl(\'teach\',\''+nx+'\')">▶ 下一課</button>':'')+'<button class="btn o" onclick="repl(\'play\',\''+a.lid+'\')">🔁 再玩一次</button><button class="btn b" onclick="goBack()">📋 回課程</button></div>';
  confetti();mood('cheer');sfxOk();say(a.st===3?'太棒了!你得到三顆星星!':a.st===2?'很好喔!你得到兩顆星星!':'好棒,你完成了!再玩一次,可以得到更多星星。');
};
R.stickers=function(){
  setTitle('🏅 我的貼紙');var all=allLessons(),n=all.filter(function(l){return ST.prog[l];}).length;
  var h='<div class="msg">已收集 '+n+' / '+all.length+' 張</div><div class="stk">';
  all.forEach(function(l){var L=LES[l],ok=ST.prog[l];h+='<div class="'+(ok?'':'no')+'">'+(ok?L.e:'❔')+'<small>'+(ok?L.t:'???')+'</small></div>';});
  $('main').innerHTML=h+'</div>';
};
// ---- 遊戲 ----
var GAMES={};
GAMES.memory=function(L,fin){
  var E=shuffle(['🐶','🐱','🐰','🐻','🐼','🦁','🐸','🐵','🍎','🍌','🚗','⭐']).slice(0,6),cards=window.__cards=shuffle(E.concat(E)),open=[],moves=0,found=0,busy=false;
  $('bub').textContent='翻開兩張一樣的牌!';say('翻開兩張一樣的牌,要記住位置喔!');
  var h='<div class="msg" id="mv" style="text-align:center">步數:0</div><div class="mem">';cards.forEach(function(c,i){h+='<button class="mc" data-i="'+i+'">❓</button>';});$('gm').innerHTML=h+'</div>';
  var bs=$('gm').querySelectorAll('.mc');
  for(var k=0;k<bs.length;k++)(function(b,i){b.onclick=function(){
    if(busy||b.className.indexOf('up')>=0||b.className.indexOf('done')>=0)return;
    b.className='mc up';b.textContent=cards[i];open.push(i);sfxTick();
    if(open.length===2){moves++;$('mv').textContent='步數:'+moves;busy=true;
      if(cards[open[0]]===cards[open[1]]){var a=open[0],c=open[1];later(function(){bs[a].className='mc done';bs[c].className='mc done';found++;sfxOk();mood('cheer');open=[];busy=false;
        if(found===6){say('全部找到了!好厲害!',function(){fin(moves<=9?0:moves<=14?2:4);});}else say('找到一對!');},400);}
      else later(function(){bs[open[0]].className='mc';bs[open[0]].textContent='❓';bs[open[1]].className='mc';bs[open[1]].textContent='❓';open=[];busy=false;},900);}
  };})(bs[k],k);
};
GAMES.odd=function(L,fin){
  var P=[['🍎','🍅'],['😀','😃'],['🐼','🐻'],['🔵','🟦'],['⭐','🌟'],['🐶','🐕'],['🌸','🌺'],['🍊','🍑']],round=0,wrong=0;
  $('bub').textContent='哪一個不一樣?';
  function next(){
    if(round>=4){say('你的眼睛好厲害!',function(){fin(wrong);});return;}
    var n=round<2?3:4,total=n*n,pr=pick(P),a=Math.random()<.5?pr[0]:pr[1],b=a===pr[0]?pr[1]:pr[0],odd=rand(0,total-1);
    var h='<div class="og" style="grid-template-columns:repeat('+n+',1fr)">';for(var i=0;i<total;i++)h+='<button data-i="'+i+'" style="'+(n===4?'font-size:34px;height:66px':'')+'">'+(i===odd?b:a)+'</button>';$('gm').innerHTML=h+'</div>';
    var bs=$('gm').querySelectorAll('button');
    for(var k=0;k<bs.length;k++)(function(bt,i){bt.onclick=function(){if(i===odd){sfxOk();mood('cheer');bt.style.background='#b7efc5';round++;hush();say('找到了!',function(){later(next,200);});}else{wrong++;sfxNo();bt.style.background='#ffd6d6';mood('oops');}};})(bs[k],k);
  }
  say('很多圖案裡,有一個不一樣,請你找出來!');next();
};
var MAZES=[['S..#.','##.#.','.....','.###.','...#G'],['S#...','.#.#.','...#.','##...','G..#.'],['S.#...','#.#.#.','....#.','.####.','......','####.G']];
GAMES.maze=function(L,fin){
  var mi=0,bump=0,x,y,M,rows,cols;
  function draw(){var h='<div class="mz" style="grid-template-columns:repeat('+cols+',1fr)">';for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){var ch=M[r][c],t='';if(ch==='#')h+='<div class="w"></div>';else{if(r===y&&c===x)t='🐻';else if(ch==='G')t='🍯';h+='<div>'+t+'</div>';}}
    $('gm').innerHTML=h+'</div><div class="dpad"><span></span><button id="u">⬆️</button><span></span><button id="l">⬅️</button><button id="d">⬇️</button><button id="r">➡️</button></div>';
    $('u').onclick=function(){mv(0,-1);};$('d').onclick=function(){mv(0,1);};$('l').onclick=function(){mv(-1,0);};$('r').onclick=function(){mv(1,0);};}
  function start(){M=MAZES[mi];rows=M.length;cols=M[0].length;for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)if(M[r][c]==='S'){y=r;x=c;}draw();$('bub').textContent='第 '+(mi+1)+' 個迷宮:帶小熊找到蜂蜜!';}
  function mv(dx,dy){var nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=cols||ny>=rows||M[ny][nx]==='#'){bump++;sfxNo();mood('oops');toast('撞到牆了');return;}
    x=nx;y=ny;sfxTick();draw();if(M[y][x]==='G'){sfxOk();mood('cheer');mi++;hush();if(mi>=MAZES.length)say('小熊吃到蜂蜜了!',function(){fin(Math.floor(bump/2));});else say('找到蜂蜜了!下一個迷宮!',function(){later(start,200);});}}
  say('用箭頭按鈕,帶小熊走到蜂蜜那裡!');start();
};
GAMES.order=function(L,fin){
  var Ns=[5,7,9],ri=0,wrong=0;$('bub').textContent='由小到大,依序點點看!';
  function round(){
    if(ri>=Ns.length){say('順序都對了!你好厲害!',function(){fin(wrong);});return;}
    var n=Ns[ri],nums=[];for(var i=1;i<=n;i++)nums.push(i);nums=shuffle(nums);var need=1;
    var h='<div class="og" style="grid-template-columns:repeat(3,1fr)">';nums.forEach(function(v){h+='<button data-v="'+v+'" style="font-weight:bold">'+v+'</button>';});$('gm').innerHTML=h+'</div>';
    var bs=$('gm').querySelectorAll('button');
    for(var k=0;k<bs.length;k++)(function(b){b.onclick=function(){var v=parseInt(b.getAttribute('data-v'),10);if(b.disabled)return;
      if(v===need){b.style.background='#b7efc5';b.disabled=true;sfxTick();need++;if(need>n){sfxOk();mood('cheer');ri++;hush();say('完成!',function(){later(round,200);});}}else{wrong++;sfxNo();b.style.background='#ffd6d6';later(function(){if(!b.disabled)b.style.background='';},500);}};})(bs[k]);
  }
  say('數字亂跑了,請從一開始,依照順序點點看!');round();
};
// ---- 家長區 ----
R.parent=function(){
  setTitle('👨‍👩‍👧 家長區');
  $('main').innerHTML='<div class="card"><div class="msg">請輸入家長密碼(預設 1234)</div><input class="pin" id="pin" type="tel" maxlength="8"><div class="row"><button class="btn g" id="pgo">進入</button></div></div>';
  $('pgo').onclick=function(){if($('pin').value===ST.pin)parentDash();else toast('密碼不對');};
};
function parentDash(){
  var h='<div class="msg">今天完成 <b>'+(ST.days[today()]||0)+'</b> 課。累計星星 <b>'+ST.stars+'</b> 顆。</div>';
  TOPICS.forEach(function(t){h+='<div class="card" style="text-align:left"><b style="font-size:24px">'+t.e+' '+t.n+'</b><table class="pt">';
    ORDER[t.id].forEach(function(l){var w=ST.wrong[l]||0,p=ST.prog[l]||0;h+='<tr><td>'+LES[l].t+'</td><td>'+(p?starStr(p):'尚未學')+'</td><td>'+(w>=4?'<span style="color:#e00">⚠ 錯 '+w+' 次,建議複習</span>':(p?'錯 '+w+' 次':''))+'</td></tr>';});
    h+='</table></div>';});
  h+='<div class="row"><button class="btn o" id="ua">'+(ST.unlockAll?'🔓 已全部解鎖(點一下恢復)':'🔓 全部解鎖')+'</button><button class="btn r" id="rs">🗑 清除進度</button></div>'+
   '<div class="card"><div class="msg">更改家長密碼(4~8 個數字)</div><input class="pin" id="np" type="tel" maxlength="8"><div class="row"><button class="btn b" id="cp">儲存新密碼</button></div></div>';
  $('main').innerHTML=h;
  $('ua').onclick=function(){ST.unlockAll=!ST.unlockAll;save();parentDash();toast(ST.unlockAll?'已全部解鎖':'已恢復');};
  var armed=false;$('rs').onclick=function(){if(!armed){armed=true;$('rs').textContent='再按一次確認清除';return;}ST.stars=0;ST.prog={};ST.wrong={};ST.days={};save();updStars();toast('已清除');parentDash();};
  $('cp').onclick=function(){var v=$('np').value;if(/^[0-9]{4,8}$/.test(v)){ST.pin=v;save();toast('密碼已更新');}else toast('請輸入 4~8 個數字');};
}
$('back').onclick=goBack;
cur=['home'];R.home();bk();
</script></body></html>
