var GEM_MODELS=['gemini-3.5-flash-lite','gemini-3.1-flash-lite','gemini-3.6-flash','gemini-2.5-flash'];
function geminiAsk(system,msgsJson,key,model,cb){
  var msgs=JSON.parse(msgsJson),contents=[];
  msgs.forEach(function(m){contents.push({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]});});
  var list=model?[model]:GEM_MODELS.slice(),idx=0,lastErr='';
  (function next(){
    if(idx>=list.length){cb(null,'AI 老師暫時連不上:'+lastErr);return;}
    var m=list[idx++];
    var body=JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:contents,generationConfig:{maxOutputTokens:800,temperature:0.7}});
    fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:body})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
    .then(function(x){
      if(x.s>=200&&x.s<300){
        var t='';try{x.j.candidates[0].content.parts.forEach(function(p){if(p.text)t+=p.text;});}catch(e){}
        t=t.trim();if(t)cb(t,null);else{lastErr='沒有回應內容';next();}
      }else{
        lastErr=(x.j&&x.j.error&&x.j.error.message)?x.j.error.message:('代碼 '+x.s);
        if(x.s===400&&/API key/i.test(lastErr)){cb(null,'Gemini 金鑰不正確,請到「🔑 AI 設定」重新貼上');return;}
        if(x.s===403){cb(null,'Gemini 金鑰沒有權限,請確認金鑰是否正確');return;}
        next();
      }
    }).catch(function(e){lastErr=String(e);next();});
  })();
}
function makeBrowserBridge(){
  var rec=null,stopped=false;
  return {
    speak:function(t,r,id){this.speakL(t,r,id,'en-US');},
    speakL:function(text,rate,id,lang){
      if(!window.speechSynthesis){setTimeout(function(){window.onSpoken(id);},50);return;}
      try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;var d=false;var fin=function(){if(!d){d=true;window.onSpoken(id);}};u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
        setTimeout(fin,Math.max(4000,text.length*400));}catch(e){window.onSpoken(id);}
    },
    listen:function(){this.listenL('en-US');},
    listenL:function(lang){
      var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){window.onHeardErr('這個瀏覽器不支援語音辨識,請用 Chrome');return;}
      try{stopped=true;if(rec)rec.abort();}catch(e){}
      stopped=false;var got=false;rec=new SR();rec.lang=lang;rec.interimResults=true;rec.maxAlternatives=1;
      rec.onresult=function(e){var t='',fin=false;for(var i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true;}
        if(fin){got=true;window.onHeard(t);}else window.onPartial(t);};
      rec.onerror=function(e){if(got||stopped)return;got=true;window.onHeardErr(e.error==='not-allowed'?'沒有麥克風權限,無法練習口說':'沒有聽到,請再說一次');};
      rec.onend=function(){if(!got&&!stopped){got=true;window.onHeardErr('沒有聽到,請再說一次');}};
      try{rec.start();}catch(e){window.onHeardErr('無法開始聆聽');}
    },
    stopAll:function(){stopped=true;try{speechSynthesis.cancel();}catch(e){}try{if(rec)rec.abort();}catch(e){}},
    ask:function(id,system,msgs){this.ask2(id,system,msgs,ST.gkey||'',ST.gmodel||'');},
    ask2:function(id,system,msgs,key,model){
      if(!key){window.onAI(id,'請先到首頁的「🔑 AI 設定」貼上 Gemini 金鑰(免費)',false);return;}
      geminiAsk(system,msgs,key,model,function(t,err){if(err)window.onAI(id,err,false);else window.onAI(id,t,true);});
    }
  };
}

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},2600);}
function addStar(n){ST.stars+=n;save();$('stars').textContent='⭐ '+ST.stars;}

// ===== 發音 / 聽寫 =====
var spokenCb={},sid=0;
function say(text,done,opt){
  opt=opt||{};var base=RATES[ST.speed||0],rate=opt.rate?Math.min(opt.rate,base):base;
  if(opt.lang==='zh-TW')rate=0.95;
  var lang=opt.lang||'en-US';
  if(EN){var id=++sid;spokenCb[id]=done||null;if(EN.speakL)EN.speakL(text,rate,id,lang);else EN.speak(text,rate,id);}
  else if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;u.onend=function(){if(done)done();};speechSynthesis.cancel();speechSynthesis.speak(u);}
  else if(done)done();
}
window.onSpoken=function(id){var f=spokenCb[id];delete spokenCb[id];if(f)f();};
window.onTtsFail=function(m){toast(m||'英文發音引擎還沒準備好');};
var listenCb=null,partialCb=null;
function listen(cb,onPart,lang){
  listenCb=cb;partialCb=onPart||null;
  if(EN){if(EN.listenL)EN.listenL(lang||'en-US');else EN.listen();}
  else{var t=window.prompt('(電腦測試)請輸入你說的英文');window.onHeard(t||'');}
}
window.onPartial=function(t){if(partialCb)partialCb(t||'');};
window.onLevel=function(v){var e=$('mic');if(e){var s=1+Math.max(0,Math.min(10,v))/14;e.style.transform='scale('+s.toFixed(2)+')';}};
window.onHeard=function(t){var f=listenCb;listenCb=null;partialCb=null;if(f)f(t||'');};
window.onHeardErr=function(m){var f=listenCb;listenCb=null;partialCb=null;if(f)f('',m||'');else toast(m||'沒有聽到,請再說一次');};
var aiCb={},aid=0;
function askAI(system,messages,cb){
  var today=new Date().toISOString().slice(0,10);
  if(ST.aiDay!==today){ST.aiDay=today;ST.aiCount=0;}
  if(ST.aiCount>=AI_LIMIT){cb(null,'今天問 AI 老師的次數用完了(上限 '+AI_LIMIT+' 次),明天再來!');return;}
  if(!EN){cb(null,'這個功能要在 Jiu Bao 的 App 裡才能用');return;}
  ST.aiCount++;save();
  var id=++aid;aiCb[id]=cb;EN.ask2?EN.ask2(id,system,JSON.stringify(messages),ST.gkey||'',ST.gmodel||''):EN.ask(id,system,JSON.stringify(messages));
}
window.onAI=function(id,text,ok){var f=aiCb[id];delete aiCb[id];if(f){if(ok)f(text,null);else f(null,text);}};

function pool(){
  if(ST.level===1)return W1;
  if(ST.level===2)return W2.concat(S2);
  return P3.concat(W3);
}
function picHtml(w){
  if(!w.pic)return '';
  if(w.pic.charAt(0)==='#')return '<span class="dot" style="background:'+w.pic+'"></span>';
  if(/^[0-9]+$/.test(w.pic))return '<span class="numpic">'+w.pic+'</span>';

function kindOf(w){return (w.cat==='句子'||w.cat==='生活會話')?'s':'w';}
function makeOptions(correct,list,n,key){
  var opts=[correct],seen={};seen[correct[key]]=1;
  list=list.filter(function(x){return kindOf(x)===kindOf(correct);});
  if(list.length<n+2)list=pool();
  shuffle(list).forEach(function(w){if(opts.length<n&&!seen[w[key]]&&w.en!==correct.en){seen[w[key]]=1;opts.push(w);}});
  return shuffle(opts);
}
var qz={};
function startRound(mode){
  var p=pool().slice();
  qz={mode:mode,qs:shuffle(p).slice(0,8),i:0,ok:0,lock:false};
  drawQ();
}
function drawQ(){
  if(qz.i>=qz.qs.length){return endRound();}
  var w=qz.qs[qz.i],h='';
  var pics=(ST.level===1&&!!w.pic);
  h+='<div class="prog"><i style="width:'+(qz.i/qz.qs.length*100)+'%"></i></div>';
  var opts;
  if(qz.mode==='quiz'){
    // 看圖/中文 → 選英文
    h+='<div class="card">'+(pics?picHtml(w):'')+'<div class="zh" style="margin-top:8px">'+esc(w.zh)+'</div><div class="msg">這是英文的哪一個?</div></div>';
    opts=makeOptions(w,pool(),4,'en');
    qz.opts=opts;qz.correct=w;
    h+='<div class="opts2">';opts.forEach(function(o,k){h+='<button class="opt" onclick="pick('+k+')">'+esc(o.en)+'</button>';});h+='</div>';
    $('main').innerHTML=h;
  }else{
    // 聽 → 選意思(幼兒選圖)
    h+='<div class="card"><div class="msg">聽聽看,選出對的答案</div><div class="row"><button class="btn o" onclick="qSay()">🔊 再聽一次</button></div></div>';
    opts=makeOptions(w,pics?pool().filter(function(x){return x.pic;}):pool(),4,pics?'en':'zh');
    qz.opts=opts;qz.correct=w;
    h+='<div class="'+(pics?'opts2':'')+'">';
    opts.forEach(function(o,k){
      if(pics)h+='<button class="opt" onclick="pick('+k+')">'+(o.pic&&o.pic.charAt(0)==='#'?'<span class="dot" style="width:70px;height:70px;background:'+o.pic+'"></span>':(o.pic&&/^[0-9]+$/.test(o.pic)?'<span class="numpic" style="font-size:70px">'+o.pic+'</span>':'<span class="p">'+o.pic+'</span>'))+'<span style="font-size:22px;color:#777">'+esc(o.zh)+'</span></button>';
      else h+='<button class="opt" onclick="pick('+k+')">'+esc(o.zh)+'</button>';
    });
    h+='</div>';
    $('main').innerHTML=h;
    setTimeout(qSay,300);
  }
  qz.lock=false;
}
window.qSay=function(){say(qz.correct.en);};
window.pick=function(k){
  if(qz.lock)return;qz.lock=true;
  var o=qz.opts[k],btns=document.querySelectorAll('.opt');
  var good=(o.en===qz.correct.en);
  btns[k].className='opt '+(good?'ok':'bad');
  if(!good){for(var j=0;j<qz.opts.length;j++)if(qz.opts[j].en===qz.correct.en)btns[j].className='opt ok';}
  if(good){qz.ok++;noteWord(qz.correct.en);}
  say(qz.correct.en,function(){setTimeout(function(){qz.i++;drawQ();},500);});
};
function endRound(){
  var n=qz.qs.length,s=qz.ok,st=s>=n?3:(s>=n*0.7?2:(s>=n*0.4?1:0));

    '<div class="row"><button class="btn g" onclick="startRound(\''+qz.mode+'\')">再玩一次</button><button class="btn gray" onclick="go(\'home\')">回首頁</button></div>';
  say(['Keep trying!','Good job!','Great!','Excellent!'][st]);
}

// --- 口說練習 ---
var sp={};
function normWords(s){return String(s).toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(function(x){return x;});}
function similar(a,b){
  var A=normWords(a),B=normWords(b);if(!A.length||!B.length)return 0;
  var m=A.length,n=B.length,d=[],i,j;
  for(i=0;i<=m;i++){d[i]=[];for(j=0;j<=n;j++)d[i][j]=0;}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=(A[i-1]===B[j-1])?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);
  return d[m][n]/Math.max(m,n);
}
R.speak=function(){
  setTitle('口說練習');$('back').style.display='';
  var p=ST.level===3?P3:(ST.level===2?S2:W1);
  sp={list:shuffle(p),i:0,auto:false,tries:0,sess:(sp.sess||0)+1};drawSpeak();
};
function drawSpeak(){
  var w=sp.list[sp.i%sp.list.length];sp.cur=w;sp.tries=0;
  $('main').innerHTML='<div class="card">'+picHtml(w)+'<div class="en '+(isLong(w)?'sm':'')+'" id="sptxt">'+spWords(w.en,null,false)+'</div><div class="zh">'+esc(w.zh)+'</div></div><div id="spres"></div>'+
   '<div class="row"><button class="btn o" onclick="spHear()">🔊 聽範例</button><button class="btn r" onclick="spMic()"><span id="mic" class="micdot">🎤</span> 我來說</button><button class="btn gray" onclick="spNext()">下一個 ▶</button></div>'+
   '<div class="row"><button class="btn '+(sp.auto?'g':'gray')+'" id="spauto" onclick="spAuto()">'+(sp.auto?'🔁 連續練習:開(按我停止)':'🔁 連續練習:關')+'</button></div>';
  var s=sp.sess;
  say(w.en,function(){if(sp.auto&&sp.sess===s&&view==='speak')spMic();});
}
// 把句子的每個字上色:heard=null 表示還沒說;heard=陣列表示即時/最後的結果
function spWords(text,heard,final){
  var A=normWords(text);if(heard===null)return esc(text);
  var h='';A.forEach(function(w){var ok=heard.indexOf(w)>=0;h+='<span class="'+(ok?'w-ok':(final?'w-bad':'w-wait'))+'">'+esc(w)+'</span> ';});return h;
}

  sp.auto=!sp.auto;var b=$('spauto');b.className='btn '+(sp.auto?'g':'gray');b.textContent=sp.auto?'🔁 連續練習:開(按我停止)':'🔁 連續練習:關';
  if(sp.auto)spMic();else{try{if(EN)EN.stopAll();}catch(e){}}
};
window.spMic=function(){
  var s=sp.sess,cur=sp.cur;
  $('spres').innerHTML='<div class="msg">🎤 請說…(邊說邊會變色)</div>';
  listen(function(t,err){
    if(sp.sess!==s||view!=='speak')return;
    if(!t){
      $('spres').innerHTML='<div class="msg">'+esc(err||'沒聽到,再按一次 🎤')+'</div>';
      if(sp.auto&&/沒有聽到/.test(err||'')){sp.tries++;if(sp.tries<3)setTimeout(function(){if(sp.sess===s&&sp.auto)spMic();},600);else{sp.auto=false;var b=$('spauto');if(b){b.className='btn gray';b.textContent='🔁 連續練習:關';}}}
      return;
    }
    var A=normWords(cur.en),B=normWords(t),score=Math.round(similar(t,cur.en)*100);
    var missed=A.filter(function(w){return B.indexOf(w)<0;});
    $('sptxt').innerHTML=spWords(cur.en,B,true);
    var h='<div class="score">'+score+'</div><div class="msg">我聽到:'+esc(t)+'</div>'+
      '<div class="msg">'+(score>=90?'太棒了!發音很清楚!':(score>=60?'不錯!紅色的字再練習一次':'再試一次,可以先按 🔊 聽範例'))+'</div>';
    $('spres').innerHTML=h;
    if(score>=60)addStar(score>=90?2:1);
    if(sp.auto){
      if(score>=85){setTimeout(function(){if(sp.sess===s&&sp.auto){sp.i++;drawSpeak();}},1200);}
      else{
        // 馬上糾正:念出說錯的字,再請你重說一次
        sp.tries++;
        if(sp.tries>=3){say('Let us try the next one.',function(){if(sp.sess===s&&sp.auto){sp.i++;drawSpeak();}});return;}
        var fix=missed.slice(0,3).join('. ');
        say(fix?('Listen. '+fix+'. Now try again.'):'Try again.',function(){if(sp.sess===s&&sp.auto)spMic();});
      }
    }else if(missed.length){
      $('spres').innerHTML+='<div class="row"><button class="btn o" onclick="spSayMissed()">🔊 聽說錯的字</button></div>';
      sp.missed=missed;
    }
  },function(part){
    if(sp.sess!==s||view!=='speak')return;
    var B=normWords(part);$('sptxt').innerHTML=spWords(cur.en,B,false);
    $('spres').innerHTML='<div class="msg">🎤 '+esc(part)+'</div>';
  });
};

function aiSystem(call){
  var c=ai.cfg,lv=['','a young child (age 4-7), use only very simple words','an elementary/junior high student, use simple sentences','an adult beginner, use practical everyday English'][ST.level];
  var fixRule='If the learner spoke Chinese, FIX = the best natural English way to say it. If the learner spoke English with mistakes, FIX = the corrected sentence. If it was already fine, FIX = OK.';
  if(c.p==='tutor'){
    var rec=(ST.recent||[]).slice(-8).join(', ');
    var base='You are Jiu Bao\'s friendly English life tutor for a Traditional Chinese speaker ('+lv+'). Your job: show how to USE English in real daily life, and answer ANY English question (vocabulary, grammar, pronunciation, culture, writing, translation). The learner may speak Chinese or English (speech recognition: ignore punctuation). ';
    if(rec)base+='Words the learner studied recently (use them in examples when natural): '+rec+'. ';
    if(c.mode==='role')return base+'Role-play this scenario: '+c.scene.t+' ('+c.scene.g+'). You play the other person (clerk, waiter, receptionist, friend, etc.). Keep each turn short. Reply in EXACTLY this format:\nEN: <your next line in the role-play, max 20 words>\nZH: <Traditional Chinese translation>\nFIX: <'+fixRule+'>\nTIP: <very short Traditional Chinese hint or praise>';
    if(c.scene)base+='The learner is practicing this real-life situation: '+c.scene.t+'. ';
    return base+'Reply in EXACTLY this format, nothing else:\nZH: <Traditional Chinese answer or explanation, spoken style, max 60 characters>\nEN: <ONE useful English sentence the learner can practice saying, with the key point, max 18 words>\nFIX: <'+fixRule+'>\nTIP: <one short practical Traditional Chinese tip about using it in daily life>';
  }
  if(call)return 'You are a warm, encouraging English teacher on a live voice call with '+lv+'. The learner\'s words come from speech recognition, so ignore capitalization and punctuation. The learner may also speak Chinese when they do not know how to say something. Reply in EXACTLY this format, nothing else:\nEN: <your short spoken reply in simple English, max 20 words, end with ONE easy follow-up question>\nZH: <Traditional Chinese translation of EN>\nFIX: <'+fixRule+'>\nTIP: <one very short Traditional Chinese tip explaining the mistake, or a short praise if OK>';
  return 'You are a warm English teacher for '+lv+'. The learner may write Chinese when they do not know how to say something in English. Reply in EXACTLY this format, nothing else:\nEN: <your reply in simple English, max 25 words>\nZH: <Traditional Chinese translation of EN>\nFIX: <'+fixRule+'>\nTIP: <one short tip in Traditional Chinese explaining the mistake, or an encouragement>\n'+(c.mode==='fix'?'Focus on correcting the learner\'s sentence. EN should be the corrected sentence.':'Keep the conversation going by asking a simple follow-up question in EN.');
}
window.aiSend=function(){
  var t=$('aitxt').value.trim();if(!t||ai.busy)return;
  sendToAI(t,false);
};
function sendToAI(t,call,hidden){
  ai.busy=true;if($('aitxt'))$('aitxt').value='';
  if(!hidden){ai.log.push({w:'u',t:t});drawAi();}
  if(call)callStatus('🤔 老師思考中…','think');else $('aistat').textContent='老師思考中…';
  var s=ai.sess;
  ai.msgs.push({role:'user',content:t});if(ai.msgs.length>6)ai.msgs=ai.msgs.slice(-6);
  askAI(aiSystem(call),ai.msgs,function(txt,err){
    if(ai.sess!==s)return;
    ai.busy=false;
    if(err){if(call){callStatus(err,'idle');endCall();}else $('aistat').textContent=err;ai.msgs.pop();return;}
    ai.msgs.push({role:'assistant',content:txt});
    var g=function(k){return ((new RegExp('(?:^|\\n)'+k+':\\s*([^\\n]+)')).exec(txt)||[])[1]||'';};
    var en=g('EN'),zh=g('ZH'),tip=g('TIP'),fix=g('FIX');
    if(!en&&!zh){en=txt;}
    if(/^ok\.?$/i.test(fix.trim()))fix='';
    ai.log.push({w:'b',t:en||zh,z:en?zh:'',tip:tip,fix:fix});drawAi();
    var c=ai.cfg,tutorQA=(c.p==='tutor'&&c.mode!=='role');
    var heardZh=/[一-鿿]/.test(t);
    // 說話順序:(糾正)更好的說法 → 標準英文 → 跟我念 → (回覆)
    var steps=[];
    if(fix){
      steps.push(function(n){say(heardZh?'英文可以這樣說:':'更好的說法是:',n,{lang:'zh-TW'});});
      steps.push(function(n){say(fix,n,{rate:0.7});});
      if(call)steps.push(function(n){shadow(fix,s,n);});
    }
    if(tutorQA){
      if(zh)steps.push(function(n){say(zh,n,{lang:'zh-TW'});});
      if(en)steps.push(function(n){say(en,n,{rate:0.75});});
      if(call&&en&&!fix)steps.push(function(n){shadow(en,s,n);});
    }else if(en){
      steps.push(function(n){say(en,n);});
    }
    if(!call){$('aistat').textContent='';runSteps(steps,s,function(){});return;}
    callStatus('🔊 老師說話中…','talk');
    runSteps(steps,s,function(){if(ai.call&&ai.sess===s)callListen();});
  });
}
function runSteps(steps,s,done){
  var i=0;(function next(){if(ai.sess!==s)return;if(i>=steps.length)return done();var f=steps[i++];f(next);})();
}
// 跟讀:老師念標準句,你跟著念,馬上用本機算分數(不花 token)
function shadow(target,s,next,tried){
  if(ai.sess!==s)return;
  callStatus('🎤 跟我念一次…','listen');var cp=$('callpart');if(cp)cp.textContent='「'+target+'」';
  listen(function(t,err){
    if(!ai.call||ai.sess!==s)return;
    if(!t){next();return;}
    var sc=Math.round(similar(t,target)*100);
    if(sc>=80){addStar(1);callStatus('👍 '+sc+' 分','talk');say('Great! Very good.',next);}
    else if(!tried){callStatus('再一次 ('+sc+' 分)','talk');say('Almost. Listen again.',function(){say(target,function(){shadow(target,s,next,true);},{rate:0.6});});}
    else{callStatus('沒關係,多練習就會進步','talk');say('Good try!',next);}
  },function(p){var e=$('callpart');if(e)e.textContent='「'+p+'」';},'en-US');
}

function callStatus(t,cls){var e=$('callst');if(e){e.textContent=t;}var m=$('mic');if(m){m.className='micbig '+(cls||'');if(cls!=='listen')m.style.transform='';}}
window.aiLang=function(){ai.lang=(ai.lang==='en-US')?'zh-TW':'en-US';var b=$('langb');if(b)b.textContent=ai.lang==='en-US'?'🇺🇸 現在用英文說(按我改中文)':'🇹🇼 現在用中文說(按我改英文)';
  try{if(EN)EN.stopAll();}catch(e){}if(ai.call&&!ai.busy){var s=ai.sess;setTimeout(function(){if(ai.call&&ai.sess===s)callListen();},200);}};
window.aiCall=function(){
  if(ai.call){endCall();return;}
  if(!EN){toast('通話模式要在 Jiu Bao 的 App 裡才能用');return;}
  ai.call=true;ai.silent=0;ai.sess++;var s=ai.sess;ai.msgs=[];ai.log=[];
  $('callb').className='btn gray';$('callb').textContent='⏹ 結束通話';
  $('callbox').innerHTML='<div class="callcard"><div id="mic" class="micbig">🎤</div><div id="callst" class="callst"></div><div id="callpart" class="callpart"></div><button class="chip" id="langb" onclick="aiLang()">'+(ai.lang==='en-US'?'🇺🇸 現在用英文說(按我改中文)':'🇹🇼 現在用中文說(按我改英文)')+'</button></div>';
  var hi=ai.cfg.hello||HELLO_T;
  if(ai.cfg.p==='tutor'&&ai.cfg.mode!=='role'){hi={t:'Hi! Ask me anything about English.',z:'嗨!有任何英文問題都可以問我,也可以說「這句話英文怎麼說」。'};}
  ai.log.push({w:'b',t:hi.t,z:hi.z});drawAi();
  callStatus('🔊 老師說話中…','talk');
  var f=function(){if(ai.call&&ai.sess===s)callListen();};
  if(ai.cfg.p==='tutor'&&ai.cfg.mode!=='role')say(hi.z,f,{lang:'zh-TW'});else say(hi.t,f);
};
function endCall(){
  ai.call=false;ai.sess++;ai.busy=false;try{if(EN)EN.stopAll();}catch(e){}
  var b=$('callb');if(b){b.className='btn g';b.textContent='📞 通話模式(免按鈕,邊說邊糾正)';}
  var c=$('callbox');if(c)c.innerHTML='';
}
function callListen(){
  var s=ai.sess;callStatus(ai.lang==='en-US'?'🎤 換你說(英文)…':'🎤 換你說(中文)…','listen');var cp=$('callpart');if(cp)cp.textContent='';
  listen(function(t,err){
    if(!ai.call||ai.sess!==s)return;
    if(!t){
      if(/權限|沒有語音辨識|無法/.test(err||'')){callStatus(err,'idle');endCall();return;}
      ai.silent++;
      if(ai.silent>=3){callStatus('好像沒有人在,通話結束了','idle');say('我會在這裡等你,準備好再按通話。',null,{lang:'zh-TW'});endCall();return;}
      callStatus('我沒聽到,再說一次吧','listen');setTimeout(function(){if(ai.call&&ai.sess===s)callListen();},500);return;
    }
    ai.silent=0;sendToAI(t,true);
  },function(p){var e=$('callpart');if(e)e.textContent='「'+p+'」';},ai.lang);
}

R.tutor=function(){
  setTitle('生活小老師');$('back').style.display='';
  var h='<div class="msg">學了英文,馬上用在生活!選一個情境,或直接問小老師</div><div class="grid"><button class="big c6" style="grid-column:1/-1" onclick="tutorAsk()">❓ 隨便問小老師<small>任何英文問題、這句怎麼說、文法、發音</small></button>';
  LIFE.forEach(function(s,k){h+='<button class="big c'+(k%5+1)+'" onclick="lifeOpen('+k+')">'+s.e+' '+esc(s.t)+'</button>';});
  $('main').innerHTML=h+'</div>';
};
window.tutorAsk=function(){openChat({p:'tutor',mode:'qa',title:'生活小老師',hello:{t:'Hi! Ask me anything about English.',z:'嗨!我是你的生活英文小老師。有任何英文問題都可以問我,也可以說「這句話英文怎麼說」。',zhSpeak:true}});view='chat';PARENT.chat='tutor';};
window.lifeOpen=function(k){lf.i=k;go('lifed');};
R.lifed=function(){
  var s=LIFE[lf.i];setTitle(s.e+' '+s.t);$('back').style.display='';
  var h='<div class="card"><div class="zh">'+esc(s.g)+'</div><div class="msg">先學這幾句,點 🔊 聽,🎤 跟著念</div></div>';
  s.p.forEach(function(x,k){var p=pair(x);h+='<div class="srow"><button class="hear" onclick="lifeSay('+k+')">🔊</button><div class="stext"><div class="se">'+esc(p.en)+'</div><div class="sz">'+esc(p.zh)+'</div></div><button class="btn r sm" onclick="lifeMic('+k+')">🎤</button></div>';});
  h+='<div id="liferes"></div><div class="row"><button class="btn gray" id="spd" onclick="cycleSpeed(true)">'+speedLabel()+'</button></div><div class="row"><button class="btn g" onclick="lifeRole()">🎭 角色扮演(和 AI 練習這個情境)</button></div><div class="row"><button class="btn o" onclick="lifeAsk()">❓ 問小老師這個情境</button></div>';
  $('main').innerHTML=h;
};
window.lifeSay=function(k){say(pair(LIFE[lf.i].p[k]).en);};
window.lifeMic=function(k){var tg=pair(LIFE[lf.i].p[k]).en;$('liferes').innerHTML='<div class="msg">🎤 請說…</div>';
  listen(function(t,err){if(view!=='lifed')return;if(!t){$('liferes').innerHTML='<div class="msg">'+esc(err||'沒聽到')+'</div>';return;}
    var sc=Math.round(similar(t,tg)*100);$('liferes').innerHTML='<div class="score">'+sc+'</div><div class="msg">我聽到:'+esc(t)+'</div>'+(sc<85?'<div class="msg">再聽一次範例再試試看</div>':'<div class="msg">很棒!</div>');if(sc>=70)addStar(1);},function(p){$('liferes').innerHTML='<div class="msg">🎤 '+esc(p)+'</div>';},'en-US');};
window.lifeRole=function(){var s=LIFE[lf.i];openChat({p:'tutor',mode:'role',scene:s,title:s.e+' '+s.t+'(角色扮演)',hello:{t:'Let us practice! I will start.',z:'我們來練習「'+s.t+'」!你可以說英文,不會說就說中文,我會教你。'},auto:'Please start the role-play with your first line.'});view='chat';PARENT.chat='lifed';};
window.lifeAsk=function(){var s=LIFE[lf.i];openChat({p:'tutor',mode:'qa',scene:s,title:s.e+' 問小老師',hello:{t:'Ask me about "'+s.t+'".',z:'關於「'+s.t+'」有什麼想問的?例如:這句話怎麼說、什麼時候用。',zhSpeak:true},auto:null});view='chat';PARENT.chat='lifed';};

// --- AI 設定(Gemini 免費金鑰)---
R.settings=function(){
  setTitle('🔑 AI 設定');$('back').style.display='';
  var has=!!ST.gkey;
  $('main').innerHTML='<div class="card" style="text-align:left"><div class="zh" style="font-size:24px;line-height:1.55">AI 老師改用 Google 的 <b>Gemini</b>(免費額度,不用付錢)。<br>1. 用電腦或手機打開 <b>aistudio.google.com/apikey</b><br>2. 登入 Google 帳號,按「Create API key」<br>3. 把產生的金鑰(AIza 開頭)貼到下面<br><small style="color:#888">金鑰只存在這台裝置裡,不會放在程式或網頁中。</small></div></div>'+
   '<div class="msg">目前狀態:'+(has?'✅ 已設定金鑰(結尾 '+esc(ST.gkey.slice(-4))+')':'⚠️ 還沒有金鑰')+'</div>'+
   '<textarea id="gkey" rows="2" placeholder="貼上 Gemini 金鑰(AIza…)" style="font-size:22px"></textarea>'+
   '<div class="msg">模型名稱(不用改,留空就會自動選)</div><textarea id="gmodel" rows="1" placeholder="例如 gemini-3.5-flash-lite" style="font-size:22px">'+esc(ST.gmodel||'')+'</textarea>'+
   '<div class="row"><button class="btn g" onclick="gSave()">💾 儲存</button><button class="btn o" onclick="gTest()">🧪 測試</button><button class="btn gray" onclick="gClear()">清除金鑰</button></div><div id="gres" class="msg"></div>';
};
window.gSave=function(){var k=$('gkey').value.trim();if(k){ST.gkey=k;}ST.gmodel=$('gmodel').value.trim();save();toast('已儲存');R.settings();};
window.gClear=function(){ST.gkey='';save();toast('已清除');R.settings();};
window.gTest=function(){
  var k=$('gkey').value.trim();if(k){ST.gkey=k;save();}
  $('gres').textContent='測試中…';
  var id=++aid;aiCb[id]=function(t,err){$('gres').textContent=err?('❌ '+err):('✅ 成功!老師說:'+t.slice(0,60));};
  EN.ask2(id,'Reply with the single word OK.',JSON.stringify([{role:'user',content:'ping'}]),ST.gkey||'',$('gmodel').value.trim()||ST.gmodel||'');
};

// ===== 開機 =====
document.getElementById('back').onclick=function(){window.goBack();};
$('stars').textContent='⭐ '+ST.stars;
R.home();
</script></body></html>
